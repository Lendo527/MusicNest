<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="vinylGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#1a1a1a"/>
      <stop offset="70%" style="stop-color:#111"/>
      <stop offset="100%" style="stop-color:#0a0a0a"/>
    </radialGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.08"/>
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0.01"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="noteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
  </defs>

  <!-- 黑胶唱片 -->
  <g transform="translate(256,256)">
    <!-- 盘体 -->
    <circle cx="0" cy="0" r="200" fill="url(#vinylGrad)" stroke="#222" stroke-width="1.5"/>
    <!-- 高光 -->
    <ellipse cx="-60" cy="-50" rx="150" ry="85" fill="url(#shine)" transform="rotate(-25)"/>
    <!-- 纹路 -->
    <g fill="none" stroke="#2a2a2a" stroke-width="0.7" opacity="0.6">
      <circle cx="0" cy="0" r="190"/>
      <circle cx="0" cy="0" r="180" stroke-width="0.5" opacity="0.4"/>
      <circle cx="0" cy="0" r="170"/>
      <circle cx="0" cy="0" r="160" stroke-width="0.5" opacity="0.4"/>
      <circle cx="0" cy="0" r="150"/>
      <circle cx="0" cy="0" r="140" stroke-width="0.5" opacity="0.4"/>
      <circle cx="0" cy="0" r="130"/>
      <circle cx="0" cy="0" r="120" stroke-width="0.5" opacity="0.4"/>
      <circle cx="0" cy="0" r="110"/>
      <circle cx="0" cy="0" r="100" stroke-width="0.5" opacity="0.4"/>
      <circle cx="0" cy="0" r="90"/>
      <circle cx="0" cy="0" r="80" stroke-width="0.5" opacity="0.4"/>
    </g>
    <!-- 标签 -->
    <circle cx="0" cy="0" r="55" fill="#f59e0b" opacity="0.9"/>
    <circle cx="0" cy="0" r="55" fill="none" stroke="#b45309" stroke-width="1" opacity="0.3"/>
    <!-- 中心孔 -->
    <circle cx="0" cy="0" r="7" fill="#0a0a0a"/>
  </g>

  <!-- 八分音符（左下角，2倍大） -->
  <g transform="translate(90,395) rotate(-15)" fill="url(#noteGrad)">
    <ellipse cx="0" cy="0" rx="28" ry="20"/>
    <rect x="25" y="-130" width="8" height="150" rx="4"/>
    <path d="M33,-130 C68,-108 86,-80 86,-60 C86,-60 62,-80 33,-96"/>
  </g>
</svg>
